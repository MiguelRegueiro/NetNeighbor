name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '\"' '/^version = \"/ { print $2; exit }' Cargo.toml)"

          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Tag/version mismatch: tag=${TAG_VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi

      - name: Verify quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate checksums
        run: |
          sha256sum target/release/netneighbor > target/release/SHA256SUMS.txt

      - name: Extract release notes from changelog
        run: |
          bash scripts/extract_changelog_section.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TOKEN="${RELEASE_TOKEN:-${GITHUB_TOKEN}}"
          if [[ -z "${TOKEN}" ]]; then
            echo "No token available for release publishing." >&2
            exit 1
          fi

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH_HEADER="Authorization: Bearer ${TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          BODY_JSON="$(jq -Rs . < RELEASE_NOTES.md)"

          get_status() {
            local url="$1"
            curl -sS -o /tmp/release_resp.json -w "%{http_code}" \
              -H "${AUTH_HEADER}" \
              -H "${ACCEPT_HEADER}" \
              "${url}"
          }

          post_json() {
            local url="$1"
            local data="$2"
            curl -sS -o /tmp/release_resp.json -w "%{http_code}" \
              -X POST \
              -H "${AUTH_HEADER}" \
              -H "${ACCEPT_HEADER}" \
              -H "Content-Type: application/json" \
              --data "${data}" \
              "${url}"
          }

          patch_json() {
            local url="$1"
            local data="$2"
            curl -sS -o /tmp/release_resp.json -w "%{http_code}" \
              -X PATCH \
              -H "${AUTH_HEADER}" \
              -H "${ACCEPT_HEADER}" \
              -H "Content-Type: application/json" \
              --data "${data}" \
              "${url}"
          }

          delete_call() {
            local url="$1"
            curl -sS -o /tmp/release_resp.json -w "%{http_code}" \
              -X DELETE \
              -H "${AUTH_HEADER}" \
              -H "${ACCEPT_HEADER}" \
              "${url}"
          }

          STATUS="$(get_status "${API}/releases/tags/${TAG}")"

          if [[ "${STATUS}" == "200" ]]; then
            RELEASE_ID="$(jq -r '.id' /tmp/release_resp.json)"
            UPDATE_PAYLOAD="$(jq -n --arg name "NetNeighbor ${TAG}" --argjson body "${BODY_JSON}" '{name: $name, body: $body}')"
            STATUS="$(patch_json "${API}/releases/${RELEASE_ID}" "${UPDATE_PAYLOAD}")"
            if [[ "${STATUS}" != "200" ]]; then
              echo "Failed to update release for tag ${TAG}. HTTP ${STATUS}" >&2
              cat /tmp/release_resp.json >&2
              exit 1
            fi
          elif [[ "${STATUS}" == "404" ]]; then
            CREATE_PAYLOAD="$(jq -n --arg tag "${TAG}" --arg name "NetNeighbor ${TAG}" --argjson body "${BODY_JSON}" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"
            STATUS="$(post_json "${API}/releases" "${CREATE_PAYLOAD}")"
            if [[ "${STATUS}" != "201" ]]; then
              echo "Failed to create release for tag ${TAG}. HTTP ${STATUS}" >&2
              cat /tmp/release_resp.json >&2
              exit 1
            fi
            RELEASE_ID="$(jq -r '.id' /tmp/release_resp.json)"
          else
            echo "Failed to query release by tag ${TAG}. HTTP ${STATUS}" >&2
            cat /tmp/release_resp.json >&2
            exit 1
          fi

          UPLOAD_URL="$(jq -r '.upload_url' /tmp/release_resp.json | sed 's/{?name,label}//')"
          if [[ -z "${UPLOAD_URL}" || "${UPLOAD_URL}" == "null" ]]; then
            STATUS="$(get_status "${API}/releases/${RELEASE_ID}")"
            if [[ "${STATUS}" != "200" ]]; then
              echo "Failed to retrieve release upload URL. HTTP ${STATUS}" >&2
              cat /tmp/release_resp.json >&2
              exit 1
            fi
            UPLOAD_URL="$(jq -r '.upload_url' /tmp/release_resp.json | sed 's/{?name,label}//')"
          fi

          upload_asset() {
            local file="$1"
            local name
            local asset_id
            local status
            name="$(basename "${file}")"

            status="$(get_status "${API}/releases/${RELEASE_ID}/assets")"
            if [[ "${status}" != "200" ]]; then
              echo "Failed to list release assets. HTTP ${status}" >&2
              cat /tmp/release_resp.json >&2
              exit 1
            fi

            asset_id="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' /tmp/release_resp.json | head -n1)"
            if [[ -n "${asset_id}" ]]; then
              status="$(delete_call "${API}/releases/assets/${asset_id}")"
              if [[ "${status}" != "204" ]]; then
                echo "Failed to delete existing asset ${name}. HTTP ${status}" >&2
                cat /tmp/release_resp.json >&2
                exit 1
              fi
            fi

            status="$(curl -sS -o /tmp/release_resp.json -w "%{http_code}" \
              -X POST \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${file}" \
              "${UPLOAD_URL}?name=${name}")"

            if [[ "${status}" != "201" ]]; then
              echo "Failed to upload asset ${name}. HTTP ${status}" >&2
              cat /tmp/release_resp.json >&2
              exit 1
            fi
          }

          upload_asset target/release/netneighbor
          upload_asset target/release/SHA256SUMS.txt
