name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = \"([^\"]+)\"/\\1/')"

          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Tag/version mismatch: tag=${TAG_VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi

      - name: Verify quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate checksums
        run: |
          sha256sum target/release/netneighbor > target/release/SHA256SUMS.txt

      - name: Extract release notes from changelog
        run: |
          bash scripts/extract_changelog_section.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "NetNeighbor ${TAG}" \
              --notes-file RELEASE_NOTES.md
            gh release upload "${TAG}" \
              target/release/netneighbor \
              target/release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${TAG}" \
              target/release/netneighbor \
              target/release/SHA256SUMS.txt \
              --title "NetNeighbor ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
